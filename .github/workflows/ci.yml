name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck -x install.sh tests/run.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install desktop-file-utils and xdg-utils
        run: sudo apt-get update && sudo apt-get install -y desktop-file-utils xdg-utils
      - name: Offline test suite
        run: bash tests/run.sh
