name: Live download check

# Fails (and GitHub emails the maintainer) when Google changes its download
# page in a way the installer no longer understands.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the latest official archives
        run: bash install.sh check desktop ide
      - name: Download and inspect the desktop archive
        run: |
          url=$(bash install.sh check desktop | sed 's/^[^:]*: //')
          curl -fsSL -o app.tar.gz "$url"
          tar -tzf app.tar.gz | head -n 5
          tar -tzf app.tar.gz | grep -qE '^[^/]+/antigravity$'
